name: Build APK

# 三种触发方式：
# 1. 手动点 Actions → Build APK → Run workflow（推荐）
# 2. 打 tag（v1.1.0）自动构建并创建 Release
# 3. 推送到 main 分支自动构建，产物在 Artifacts 里
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

# 稳定签名：仓库里配好这 4 个 secret 就会用同一把密钥签名，
# 这样每个新版本都能直接覆盖安装（不配则退回默认 debug 签名，逐次构建签名都不同，只能卸载重装）。
# Gradle 会把 ORG_GRADLE_PROJECT_xxx 环境变量当作 -Pxxx 项目属性读取。
env:
  ORG_GRADLE_PROJECT_DSBW_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
  ORG_GRADLE_PROJECT_DSBW_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
  ORG_GRADLE_PROJECT_DSBW_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/deepseek-widget.jks"
            echo "ORG_GRADLE_PROJECT_DSBW_STORE_FILE=$RUNNER_TEMP/deepseek-widget.jks" >> "$GITHUB_ENV"
            echo "已写入签名密钥，本次使用稳定签名"
          else
            echo "::warning::未配置 SIGNING_KEYSTORE_BASE64，本次退回 debug 签名；这种包的签名每次构建都不同，无法覆盖安装"
          fi

      # 直接使用系统 Gradle 8.9，无需仓库里放 gradle-wrapper.jar
      - name: 安装并缓存 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 生成 Gradle Wrapper（可选，失败不影响构建）
        run: gradle wrapper --gradle-version 8.9 --no-daemon || true

      - name: 运行单元测试（峰谷判定 / 余额解析）
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 编译 Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 编译 Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: 校验 APK 签名（确认能覆盖安装旧版本）
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          for apk in $(find app/build/outputs/apk -name '*.apk' | sort); do
            echo "===== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | sed -n '1,8p'
          done

      - name: 汇总产物信息
        run: |
          echo "### 构建产物" >> $GITHUB_STEP_SUMMARY
          find app/build/outputs/apk -name '*.apk' -printf '%p  %k KB\n' | tee -a $GITHUB_STEP_SUMMARY || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-balance-widget-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传测试报告（失败时排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: 打 tag 时创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true

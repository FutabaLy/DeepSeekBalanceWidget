name: Build APK

# 三种触发方式：
# 1. 手动点 Actions → Build APK → Run workflow（推荐）
# 2. 打 tag（v1.0.0）自动构建并创建 Release
# 3. 推送到 main 分支自动构建，产物在 Artifacts 里
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 直接使用系统 Gradle 8.9，无需仓库里放 gradle-wrapper.jar
      - name: 安装并缓存 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 生成 Gradle Wrapper（可选，失败不影响构建）
        run: gradle wrapper --gradle-version 8.9 --no-daemon || true

      - name: 运行单元测试（峰谷判定 / 余额解析）
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 编译 Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 编译 Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: 汇总产物信息
        run: |
          echo "### 构建产物" >> $GITHUB_STEP_SUMMARY
          find app/build/outputs/apk -name '*.apk' -printf '%p  %k KB\n' | tee -a $GITHUB_STEP_SUMMARY || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-balance-widget-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传测试报告（失败时排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: 打 tag 时创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
